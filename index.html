<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gimnasiada — Orden de presentaciones</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Gimnasiada</h1>
      <p class="event-date">Día 15 de setiembre</p>
      <h2>Orden de presentación</h2>
      <p class="lead">
        Subí el MP3 de tu escuela a la carpeta de Drive y marcá
        <strong>Ya subí</strong>. El Ok queda registrado para todos los docentes.
      </p>
      <p id="sync-status" class="sync-status" role="status" aria-live="polite"></p>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="site-footer">
      <p>
        Nombrá el archivo como se indica en cada escuela (ej.
        <code>escuela-1.mp3</code>).
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
